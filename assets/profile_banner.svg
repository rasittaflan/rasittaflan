<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <!-- Solid Technical Background -->
    <linearGradient id="academicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- CAD Hatch Pattern for Magnetic Core Laminations -->
    <pattern id="coreHatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#334155" stroke-width="1.2" stroke-opacity="0.7"/>
    </pattern>

    <!-- Clean Technical Drafting Grid -->
    <pattern id="cadGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>

    <!-- Arrowhead Marker for CAD Dimensions -->
    <marker id="arrowCAD" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowCADBack" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 2 L 0 5 L 8 8 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Canvas Background & CAD Grid -->
  <rect width="1200" height="280" rx="8" fill="url(#academicBg)"/>
  <rect width="1200" height="280" rx="8" fill="url(#cadGrid)"/>

  <!-- Subtle Top Engineering Accent Border -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#0284c7" stroke-width="2"/>

  <!-- ==================== LEFT SECTION: ACADEMIC & PROFESSIONAL IDENTITY ==================== -->
  <g transform="translate(60, 42)">
    
    <!-- Institution Header with Technical Dot -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="5" r="4" fill="#0284c7"/>
      <text x="18" y="9" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">
        KARADENİZ TECHNICAL UNIVERSITY • DEPARTMENT OF EEE
      </text>
    </g>

    <!-- Engineer Name -->
    <text x="0" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="0.3">
      Muhammet Raşit Taflan
    </text>

    <!-- Professional Status (Accurate Academic Title) -->
    <text x="0" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500">
      Electrical &amp; Electronics Engineering Student
    </text>

    <!-- Thin Divider -->
    <line x1="0" y1="102" x2="480" y2="102" stroke="#334155" stroke-width="1"/>

    <!-- Core Engineering Focus Domains -->
    <g transform="translate(0, 126)">
      <text x="0" y="0" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="600">
        Power Electronics <tspan fill="#475569">|</tspan> Embedded Systems <tspan fill="#475569">|</tspan> Control Systems <tspan fill="#475569">|</tspan> Engineering Simulation
      </text>
    </g>

    <!-- Primary Engineering Engagements (Clean Text Format) -->
    <g transform="translate(0, 162)">
      <rect x="0" y="0" width="160" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="80" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">
        TÜBİTAK 2209-B Researcher
      </text>

      <rect x="170" y="0" width="165" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="252" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">
        Vestel R&amp;D Intern ('26)
      </text>

      <rect x="345" y="0" width="160" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="425" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">
        Former EV Team Captain
      </text>
    </g>

  </g>

  <!-- ==================== RIGHT SECTION: CAD & FEA TECHNICAL SCHEMATIC ==================== -->
  <g transform="translate(680, 24)">
    
    <!-- Drafting Frame -->
    <rect x="0" y="0" width="460" height="232" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1.2"/>
    
    <!-- Frame Header Bar -->
    <path d="M 0 6 C 0 2.68 2.68 0 6 0 L 454 0 C 457.32 0 460 2.68 460 6 L 460 26 L 0 26 Z" fill="#0f1c38"/>
    <line x1="0" y1="26" x2="460" y2="26" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Header Labels -->
    <text x="14" y="17" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1">
      FEA ELECTROMAGNETIC ACTUATOR // CAD SCHEMATIC
    </text>
    <text x="446" y="17" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" text-anchor="end">
      KTÜ TÜBİTAK 2209-B
    </text>

    <!-- Drafting Area: Cross-Section of Cylindrical/U Actuator -->
    <g transform="translate(60, 42)">
      
      <!-- Stator Magnetic Core (Cross-Hatched Silicon Steel) -->
      <path d="M 40 10 L 140 10 L 140 35 L 115 35 L 115 75 L 65 75 L 65 35 L 40 35 Z" 
            fill="url(#coreHatch)" stroke="#94a3b8" stroke-width="1.4"/>

      <!-- Solenoid Copper Coil Cross-Sections (Left & Right of center leg) -->
      <!-- Left Coil -->
      <rect x="15" y="38" width="22" height="34" rx="2" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <line x1="26" y1="38" x2="26" y2="72" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="2,2"/>
      <text x="26" y="58" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">N</text>

      <!-- Right Coil -->
      <rect x="143" y="38" width="22" height="34" rx="2" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <line x1="154" y1="38" x2="154" y2="72" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="2,2"/>
      <text x="154" y="58" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">N</text>

      <!-- Magnetic Target / Plunger (Armature Target) -->
      <rect x="25" y="100" width="130" height="20" rx="2" fill="url(#coreHatch)" stroke="#94a3b8" stroke-width="1.4"/>
      <text x="90" y="114" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">ARMATURE (STEEL 1008)</text>

      <!-- Magnetic Flux Path Lines (Symmetric loops across air gap) -->
      <path d="M 90 25 C 130 25, 130 90, 90 108" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.85"/>
      <path d="M 90 25 C 50 25, 50 90, 90 108" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.85"/>

      <!-- Dimension Lines: Air Gap (g = 5.0 mm) -->
      <line x1="175" y1="75" x2="175" y2="100" stroke="#38bdf8" stroke-width="1" marker-end="url(#arrowCAD)" marker-start="url(#arrowCADBack)"/>
      <line x1="165" y1="75" x2="185" y2="75" stroke="#475569" stroke-width="0.8"/>
      <line x1="155" y1="100" x2="185" y2="100" stroke="#475569" stroke-width="0.8"/>
      <text x="190" y="90" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold">g = 5.0 mm</text>

      <!-- Dimension Line: Core Width -->
      <line x1="40" y1="4" x2="140" y2="4" stroke="#64748b" stroke-width="0.8"/>
      <line x1="40" y1="1" x2="40" y2="7" stroke="#64748b" stroke-width="0.8"/>
      <line x1="140" y1="1" x2="140" y2="7" stroke="#64748b" stroke-width="0.8"/>
      <text x="90" y="-1" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">2r = 10.0 mm</text>

      <!-- Mathematical Model Annotation Box (Right/Bottom) -->
      <g transform="translate(180, 20)">
        <rect x="0" y="0" width="145" height="48" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="16" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">GOVERNING EQUATION</text>
        <text x="10" y="32" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">F = (μ₀·A·N²·I²) / 4g²</text>
        <text x="10" y="42" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="7.5">NONLINEAR PLANT DYNAMICS</text>
      </g>

      <!-- Verified Measurement Chip -->
      <g transform="translate(180, 76)">
        <rect x="0" y="0" width="145" height="42" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="10" y="15" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">VERIFIED FEA RESULT (V1)</text>
        <text x="10" y="31" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold">F_v1 = 0.4823 N</text>
        <text x="92" y="31" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">@ 4.8 A</text>
      </g>

    </g>

    <!-- Bottom Metadata Status Bar -->
    <rect x="0" y="210" width="460" height="22" rx="0" fill="#070d1d"/>
    <line x1="0" y1="210" x2="460" y2="210" stroke="#1e293b" stroke-width="0.8"/>
    <text x="14" y="224" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="8.5">
      CORE: SILICON STEEL // B_SAT ≈ 1.8 T // ANSYS MAXWELL 2D/3D VERIFIED
    </text>
  </g>

</svg>
